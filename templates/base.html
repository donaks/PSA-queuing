<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PSA Queue{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #132033;
      --muted: #657184;
      --line: #d9e1ec;
      --blue: #165dba;
      --green: #087f5b;
      --red: #c92a2a;
      --gold: #a16207;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(1.7rem, 3vw, 2.5rem);
      line-height: 1.1;
    }

    h2 {
      font-size: 1rem;
    }

    .muted {
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
    }

    .queue-card {
      display: grid;
      gap: 14px;
      min-height: 220px;
    }

    .queue-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      color: var(--muted);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .numbers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .number-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fbfcfe;
    }

    .label {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .value {
      margin-top: 6px;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button,
    input {
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font: inherit;
    }

    button {
      cursor: pointer;
      background: var(--blue);
      color: white;
      border-color: var(--blue);
      padding: 0 14px;
      font-weight: 700;
    }

    button.secondary {
      background: #ffffff;
      color: var(--text);
    }

    button.danger {
      background: var(--red);
      border-color: var(--red);
    }

    input {
      width: 96px;
      padding: 0 10px;
      background: white;
      color: var(--text);
    }

    .max-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .max-row input {
      width: 150px;
    }

    .notice {
      margin: 12px 0 0;
      color: var(--gold);
      min-height: 1.25rem;
    }

    .display-grid {
      grid-template-columns: repeat(2, minmax(260px, 1fr));
    }

    .display-shell {
      width: 100%;
      min-height: 100vh;
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
    }

    .display-shell .topbar {
      margin-bottom: 0;
    }

    .display-shell h1 {
      font-size: clamp(2.4rem, 4vw, 4.8rem);
    }

    .display-shell .muted {
      font-size: clamp(1rem, 1.6vw, 1.8rem);
    }

    .display-shell .display-grid {
      min-height: 0;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .display-card {
      min-height: 260px;
      display: grid;
      align-content: center;
      text-align: center;
      gap: 20px;
      border-top-width: 10px;
    }

    .display-shell .display-card {
      min-height: 0;
      height: 100%;
      padding: clamp(18px, 2vw, 34px);
      gap: clamp(14px, 2vh, 30px);
      border-top-width: 16px;
    }

    .display-shell .display-card h2 {
      font-size: clamp(1.8rem, 3vw, 4rem);
      line-height: 1;
    }

    .display-shell .display-card .label {
      font-size: clamp(0.95rem, 1.4vw, 1.8rem);
    }

    .display-card.reg-pri {
      border-top-color: var(--gold);
    }

    .display-card.reg-reg {
      border-top-color: var(--blue);
    }

    .display-card.iss-pri {
      border-top-color: var(--green);
    }

    .display-card.iss-reg {
      border-top-color: var(--red);
    }

    .display-card .value {
      font-size: clamp(4rem, 12vw, 9rem);
    }

    .display-shell .display-card .value {
      font-size: clamp(6rem, 15vw, 18rem);
    }

    .display-shell .display-card .badge {
      font-size: clamp(1rem, 1.8vw, 2.1rem);
      padding: 8px 14px;
    }

    .links,
    .subtle-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .topbar .subtle-actions {
      margin-top: 0;
    }

    .link-button {
      display: inline-grid;
      place-items: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      text-decoration: none;
      font-weight: 700;
    }

    .link-button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    .auth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-card {
      width: min(420px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
      padding: 24px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .form-grid input {
      width: 100%;
      min-height: 46px;
    }

    .form-grid button {
      min-height: 46px;
    }

    .error {
      margin-top: 12px;
      color: #9b1c1c;
      background: #fff0f0;
      border: 1px solid #ffc9c9;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .table-wrap {
      overflow-x: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #edf1f6;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #f8fafc;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    code {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.9em;
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .display-grid {
        grid-template-columns: 1fr;
      }

      .display-shell {
        min-height: 100vh;
        padding: 12px;
      }

      .display-shell .display-grid {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, minmax(220px, 1fr));
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
