{% extends "base.html" %}
{% block title %}PSA Queue Display{% endblock %}
{% block body %}
  <main class="shell display-shell">
    <div class="topbar">
      <div>
        <h1>Now Serving</h1>
        <p class="muted">Branch: {{ branch }} · <span id="announcement">Waiting for queue updates.</span></p>
      </div>
    </div>

    <section class="grid display-grid" id="display"></section>
  </main>

  <script>
    const queueLabels = {
      "reg-pri": ["Registration", "Priority"],
      "reg-reg": ["Registration", "Regular"],
      "iss-pri": ["Issuance", "Priority"],
      "iss-reg": ["Issuance", "Regular"]
    };
    const branch = "{{ branch }}";

    let latestAnnouncementId = 0;

    function formatValue(value) {
      return value === null || value === undefined ? "-" : value;
    }

    function render(state) {
      const root = document.getElementById("display");
      root.innerHTML = "";

      Object.entries(queueLabels).forEach(([queue, labels]) => {
        const q = state[queue] || {};
        const card = document.createElement("article");
        card.className = `card display-card ${queue}`;
        card.innerHTML = `
          <div>
            <h2>${labels[0]}</h2>
            <p class="muted">${labels[1]}</p>
          </div>
          <div>
            <div class="label">Serving</div>
            <div class="value">${formatValue(q.serving)}</div>
          </div>
          <div>
            <span class="badge">Called: ${formatValue(q.called)}</span>
          </div>
        `;
        root.appendChild(card);
      });
    }

    async function refreshState() {
      const response = await fetch(`/api/state?branch=${encodeURIComponent(branch)}`, {cache: "no-store"});
      render(await response.json());
    }

    async function refreshAnnouncements() {
      const response = await fetch(`/api/announcements?branch=${encodeURIComponent(branch)}&since=${latestAnnouncementId}`, {cache: "no-store"});
      const payload = await response.json();
      latestAnnouncementId = payload.latest_id || latestAnnouncementId;
      if (payload.events && payload.events.length) {
        document.getElementById("announcement").textContent = payload.events[payload.events.length - 1].message;
      }
    }

    refreshState();
    refreshAnnouncements();
    setInterval(refreshState, 1500);
    setInterval(refreshAnnouncements, 1500);
  </script>
{% endblock %}
