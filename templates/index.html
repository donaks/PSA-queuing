{% extends "base.html" %}
{% block title %}PSA Queue Controller{% endblock %}
{% block body %}
  <main class="shell">
    <div class="topbar">
      <div>
        <h1>Queue Controller</h1>
        <p class="muted">Branch: {{ branch }} · User: {{ username }} · <span id="lastUpdated">Updating...</span></p>
      </div>
      <div class="subtle-actions">
        <a class="link-button" href="/">Home</a>
        <a class="link-button" href="/audit">Audit logs</a>
        <a class="link-button" href="/logout">Logout</a>
        <a class="link-button primary" href="/branch/{{ branch }}/display">Open display</a>
      </div>
    </div>

    <section class="grid" id="queues"></section>
    <p class="notice" id="notice"></p>
  </main>

  <script>
    const queueLabels = {
      "reg-pri": ["Registration", "Priority"],
      "reg-reg": ["Registration", "Regular"],
      "iss-pri": ["Issuance", "Priority"],
      "iss-reg": ["Issuance", "Regular"]
    };

    const branch = "{{ branch }}";

    function formatValue(value) {
      return value === null || value === undefined ? "-" : value;
    }

    async function postJson(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: body ? JSON.stringify(body) : null
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (response.status === 401) {
          window.location.href = "/login?next=/controller";
          return;
        }
        throw new Error(payload.error || "Request failed");
      }
      return payload;
    }

    function render(state) {
      const root = document.getElementById("queues");
      const activeMaxInput = document.activeElement && document.activeElement.matches("[data-max]")
        ? document.activeElement
        : null;
      const activeMaxQueue = activeMaxInput ? activeMaxInput.dataset.max : "";
      const activeMaxValue = activeMaxInput ? activeMaxInput.value : "";
      root.innerHTML = "";

      Object.entries(queueLabels).forEach(([queue, labels]) => {
        const q = state[queue] || {};
        const maxValue = activeMaxQueue === queue ? activeMaxValue : (q.max || "");
        const card = document.createElement("article");
        card.className = "card queue-card";
        card.innerHTML = `
          <div class="queue-title">
            <div>
              <h2>${labels[0]}</h2>
              <p class="muted">${labels[1]}</p>
            </div>
            <span class="badge">${queue}</span>
          </div>
          <div class="numbers">
            <div class="number-box">
              <div class="label">Serving</div>
              <div class="value">${formatValue(q.serving)}</div>
            </div>
            <div class="number-box">
              <div class="label">Called</div>
              <div class="value">${formatValue(q.called)}</div>
            </div>
          </div>
          <div class="actions">
            <button data-action="next" data-queue="${queue}">Next</button>
            <button class="danger" data-action="reset" data-queue="${queue}">Reset</button>
            <div class="max-row">
              <input type="number" min="1" placeholder="Max" value="${maxValue}" data-max="${queue}" aria-label="Maximum queue number for ${labels[0]} ${labels[1]}">
              <button class="secondary" data-action="max" data-queue="${queue}">Set max</button>
            </div>
          </div>
        `;
        root.appendChild(card);
      });

      if (activeMaxQueue) {
        const restoredInput = document.querySelector(`[data-max="${activeMaxQueue}"]`);
        if (restoredInput) {
          restoredInput.focus();
          const cursorPosition = restoredInput.value.length;
          restoredInput.setSelectionRange(cursorPosition, cursorPosition);
        }
      }
    }

    async function refresh() {
      const response = await fetch(`/api/state?branch=${encodeURIComponent(branch)}`, {cache: "no-store"});
      render(await response.json());
      document.getElementById("lastUpdated").textContent = `Updated ${new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"})}`;
    }

    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const queue = button.dataset.queue;
      const action = button.dataset.action;
      const notice = document.getElementById("notice");
      notice.textContent = "";

      try {
        if (action === "next") {
          await postJson(`/api/next/${queue}`);
        } else if (action === "reset") {
          await postJson(`/api/reset/${queue}`);
        } else if (action === "max") {
          const input = document.querySelector(`[data-max="${queue}"]`);
          await postJson(`/api/max/${queue}`, {max: input.value});
        }
        await refresh();
      } catch (error) {
        notice.textContent = error.message;
      }
    });

    refresh();
    setInterval(refresh, 2500);
  </script>
{% endblock %}
