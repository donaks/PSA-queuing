<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PSA Queue{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f7;
      --panel: #ffffff;
      --text: #132033;
      --muted: #657184;
      --line: #d9e1ec;
      --soft-line: #edf1f6;
      --blue: #0f5fb8;
      --blue-dark: #0b4d94;
      --blue-soft: #e9f2ff;
      --green: #087f5b;
      --green-soft: #e8f7f0;
      --red: #c92a2a;
      --red-soft: #fff0f0;
      --gold: #a16207;
      --gold-soft: #fff7df;
      --shadow: 0 16px 34px rgba(21, 38, 64, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, #dfe8f4 0, var(--bg) 320px),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(1.65rem, 3vw, 2.35rem);
      line-height: 1.1;
    }

    h2 {
      font-size: 1.05rem;
      line-height: 1.2;
    }

    .muted {
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .surface {
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(217, 225, 236, 0.9);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(21, 38, 64, 0.07);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      padding: 0 11px;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--green);
    }

    .queue-card {
      display: grid;
      gap: 16px;
      min-height: 268px;
      overflow: hidden;
      position: relative;
    }

    .queue-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--blue);
    }

    .queue-card.priority::before {
      background: var(--gold);
    }

    .queue-card.cutoff {
      background: #fffafa;
      border-color: #ffd2d2;
    }

    .queue-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge.priority {
      background: var(--gold-soft);
      border-color: #f1d48a;
      color: var(--gold);
    }

    .badge.regular {
      background: var(--blue-soft);
      border-color: #c6dcfb;
      color: var(--blue-dark);
    }

    .numbers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .number-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fbfcfe;
      min-width: 0;
    }

    .number-box.primary {
      background: var(--green-soft);
      border-color: #b8e3cf;
    }

    .number-box.waiting {
      background: var(--blue-soft);
      border-color: #c6dcfb;
    }

    .label {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .value {
      margin-top: 6px;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1;
      word-break: break-word;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: center;
    }

    .max-row {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding-top: 2px;
    }

    button,
    input {
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font: inherit;
    }

    button {
      cursor: pointer;
      background: var(--blue);
      color: white;
      border-color: var(--blue);
      padding: 0 14px;
      font-weight: 700;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    button:hover {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: #ffffff;
      color: var(--text);
    }

    button.secondary:hover {
      background: #f7f9fc;
      border-color: #c5cfdd;
    }

    button.danger {
      background: var(--red);
      border-color: var(--red);
    }

    button.danger:hover {
      background: #a61e1e;
      border-color: #a61e1e;
    }

    input {
      width: 100%;
      padding: 0 10px;
      background: white;
      color: var(--text);
    }

    input.token-input {
      width: min(260px, 100%);
    }

    .notice {
      margin: 14px 0 0;
      color: #7c4a03;
      background: var(--gold-soft);
      border: 1px solid #eed087;
      border-radius: 8px;
      padding: 10px 12px;
      min-height: 1.25rem;
      display: none;
    }

    .notice:not(:empty) {
      display: block;
    }

    .display-grid {
      grid-template-columns: repeat(2, minmax(260px, 1fr));
    }

    .display-card {
      min-height: 260px;
      display: grid;
      align-content: center;
      text-align: center;
      gap: 20px;
    }

    .display-card .value {
      font-size: clamp(4rem, 12vw, 9rem);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .link-button {
      display: inline-grid;
      place-items: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      text-decoration: none;
      font-weight: 700;
    }

    .link-button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .summary-item {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .summary-value {
      margin-top: 7px;
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1;
    }

    .subtle-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .token-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
      padding: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }

      .display-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 460px) {
      .numbers,
      .actions,
      .summary-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
